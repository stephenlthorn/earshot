name: Feature request
description: Suggest an idea or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Earshot keeps a few principles: audio never leaves your Mac, every AI feature is off until you turn it on, and the AI never acts without your click. Ideas that fit those are the easiest to take on.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
      placeholder: After a sales call I copy each action item into my CRM by hand.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How would it work for you? Describe what you'd see and click.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds or other tools you've used, and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording
        - Transcription
        - Notes
        - Live assistant or the panel
        - Calendar and the brief
        - Noticing calls
        - Flags, ask or fix
        - Screen reading
        - Do targets
        - MCP server, command-line tool or plugins
        - Settings or onboarding
        - Docs
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to open a pull request for this.
